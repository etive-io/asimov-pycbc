name: 'Setup asimov-pycbc Environment'
description: 'Install asimov-pycbc (and its asimov + PyCBC dependencies) with conda'
inputs:
  python-version:
    description: 'Python version to use'
    default: '3.11'
    required: false
  conda-packages:
    description: 'Path to conda packages file; set to empty string to skip heavy conda packages'
    default: 'conda/packages.txt'
    required: false
runs:
  using: "composite"
  steps:
    - name: Cache conda packages and pip
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/miniconda/pkgs
          ~/.cache/pip
        key: conda-${{ runner.os }}-${{ hashFiles('conda/packages.txt', 'pyproject.toml') }}
        restore-keys: |
          conda-${{ runner.os }}-

    - name: Set up conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-activate-base: false
        python-version: ${{ inputs.python-version }}
        activate-environment: asimov
        channels: conda-forge
        use-mamba: true

    - name: Cache asimov-pycbc conda env
      id: cache-env
      uses: actions/cache@v4
      with:
        path: /usr/share/miniconda/envs/asimov
        key: conda-env-asimov-pycbc-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('conda/packages.txt', 'pyproject.toml') }}
        restore-keys: |
          conda-env-asimov-pycbc-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install conda dependencies (PyCBC)
      # PyCBC ships on conda-forge with its own runtime dependencies, but
      # its optional nested-sampling backend (pycbc.inference.sampler.dynesty)
      # imports `dynesty.nestedsamplers`, a module that was removed from
      # dynesty>=2 -- confirmed by running `pycbc_inference` for real against
      # the latest dynesty (3.x) while developing this test, which fails with
      # `ModuleNotFoundError: No module named 'dynesty.nestedsamplers'`.
      # Pin to the last 1.x release, which still ships it.
      if: steps.cache-env.outputs.cache-hit != 'true' && inputs.conda-packages != ''
      shell: bash -el {0}
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        conda install -y -n asimov --file ${{ inputs.conda-packages }}

    - name: Install asimov-pycbc from source
      shell: bash -e {0}
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        CONDA_BASE="$("${CONDA_EXE:-conda}" info --base)"
        CONDA_PYTHON="${CONDA_BASE}/envs/asimov/bin/python"
        "$CONDA_PYTHON" -m ensurepip --upgrade
        "$CONDA_PYTHON" -m pip install --force-reinstall -e ".[test]"
        # Regular (non-editable) installs set explicit, world-readable
        # permissions from the wheel's RECORD; an editable install's
        # metadata (entry_points.txt etc.) is instead written fresh by pip
        # subject to the current process umask. This step runs as root, and
        # under a restrictive root umask the resulting dist-info can end up
        # unreadable by `submituser` -- which silently drops this package's
        # `asimov.pipelines` entry point (asimov's own plugin loader catches
        # and swallows the failure) rather than erroring here. Force
        # everything world-readable so submituser can always see it.
        chmod -R a+rX "$CONDA_BASE/envs/asimov"
        echo "Installed asimov-pycbc from: $("$CONDA_PYTHON" -c 'import asimov_pycbc; print(asimov_pycbc.__file__)')"
        echo "Installed asimov from: $("$CONDA_PYTHON" -c 'import asimov; print(asimov.__file__)')"
        echo "Installed pycbc_inference at: $("$CONDA_PYTHON" -c 'import shutil; print(shutil.which("pycbc_inference"))')"
