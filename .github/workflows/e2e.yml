name: End-to-end test (real pycbc_inference)

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: "PyCBC end-to-end test (HTCondor)"
    runs-on: ubuntu-latest
    container:
      image: htcondor/mini:latest
      options: --privileged
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: etive-io/actions/setup-htcondor@v1

      - name: Install base tools
        run: |
          yum install -y sudo git

      - name: Create submit user
        uses: etive-io/actions/create-submit-user@v1

      - name: Ensure submituser can access workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e_project"
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Setup asimov-pycbc Environment
        uses: ./.github/actions/setup-pycbc-env
        with:
          python-version: "3.11"

      - name: Set up git
        run: |
          su - submituser <<SUBMITUSER
          set -euo pipefail
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          SUBMITUSER

      - name: Create asimov project
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov init "E2E Test Project"

      - name: Configure asimov environment and condor user
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            if [ -z "$CONDA_PREFIX" ] || [ ! -x "$CONDA_PREFIX/bin/pycbc_inference" ]; then
              echo "::error::CONDA_PREFIX ('$CONDA_PREFIX') does not contain bin/pycbc_inference" >&2
              exit 1
            fi
            asimov configuration update pipelines/environment "$CONDA_PREFIX"
            asimov configuration update condor/user submituser

      - name: Diagnose asimov.pipelines entry-point discovery as submituser
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            python3 -c "
            from importlib.metadata import entry_points
            eps = [ep for ep in entry_points(group='asimov.pipelines') if ep.value.startswith('asimov_pycbc')]
            print('Discovered asimov_pycbc entry points:', eps)
            for ep in eps:
                try:
                    ep.load()
                    print(f'  {ep.name}: loaded OK')
                except Exception as e:
                    print(f'  {ep.name}: FAILED TO LOAD: {e!r}')
            "

      - name: Apply fake event
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/fake_event.yaml"

      # PyCBC needs no fake upstream pipeline (unlike PESummary, which needs
      # a fake sample-producing analysis to post-process): it runs against
      # its own built-in simulated ("fake-strain") Gaussian noise via
      # pycbc_inference's --fake-strain/--psd-model options, so the
      # production under test is entirely self-contained -- no real strain
      # data, datafind server, or the separate asimov-gwdata plugin needed.
      # What it *does* need is a real, working pycbc_inference ini, pre-seeded
      # directly into the event repository (the "pre-seed a real .ini"
      # alternative from the e2e-testing howto, rather than exercising
      # asimov_pycbc's config_template Liquid rendering, which is covered
      # separately by tests/test_pycbc.py).
      #
      # These settings (single detector, fake-strain noise, dynesty with
      # nlive=50/dlogz=5.0, 2 variable parameters: distance + inclination)
      # were hand-validated by running pycbc_inference directly before being
      # wired into asimov: the run completes in well under 10 seconds.
      - name: Seed the PyCBC ini fixture
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project/checkouts/FAKE_PYCBC_TEST_EVENT
            mkdir -p analyses
            cat > analyses/pycbc-test.ini << 'EOF'
            [data]
            instruments = H1
            trigger-time = 1126259462.4
            analysis-start-time = -2
            analysis-end-time = 2
            sample-rate = 2048
            pad-data = 8
            fake-strain = H1:aLIGOZeroDetHighPower
            fake-strain-seed = 1234
            psd-model = H1:aLIGOZeroDetHighPower
            channel-name = H1:FAKE-STRAIN

            [model]
            name = gaussian_noise
            low-frequency-cutoff = 30

            [variable_params]
            distance =
            inclination =

            [static_params]
            approximant = IMRPhenomD
            f_lower = 30
            f_ref = 30
            mass1 = 35
            mass2 = 30
            spin1z = 0
            spin2z = 0
            tc = 1126259462.4
            ra = 2.2
            dec = -1.25
            polarization = 0
            coa_phase = 0

            [prior-distance]
            name = uniform
            min-distance = 100
            max-distance = 2000

            [prior-inclination]
            name = sin_angle

            [sampler]
            name = dynesty
            dlogz = 5.0
            nlive = 50
            EOF
            git add analyses/pycbc-test.ini
            git commit -m "Seed PyCBC ini fixture"

      - name: Add and build the real PyCBC production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/pycbc_production.yaml" -e FAKE_PYCBC_TEST_EVENT
            asimov manage build submit

      - name: Inspect the generated command
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            find working/FAKE_PYCBC_TEST_EVENT/pycbc-test -maxdepth 1
            echo "--- pycbc.sh ---"
            cat working/FAKE_PYCBC_TEST_EVENT/pycbc-test/pycbc.sh
            # A real pycbc_inference invocation against the seeded ini, not a stub.
            grep -q "pycbc_inference" working/FAKE_PYCBC_TEST_EVENT/pycbc-test/pycbc.sh
            grep -q "pycbc-test.ini" working/FAKE_PYCBC_TEST_EVENT/pycbc-test/pycbc.sh
            grep -q -- "--force" working/FAKE_PYCBC_TEST_EVENT/pycbc-test/pycbc.sh

      # This is the real completion criterion asimov_pycbc's
      # detect_completion() checks for -- not a smoke-test proxy. Reaching it
      # means pycbc_inference genuinely ran a full dynesty nested-sampling
      # run against simulated noise, and produced a real, parseable
      # posterior file.
      - name: Wait for real posterior samples
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "pycbc-test.hdf"
          directory: "working/FAKE_PYCBC_TEST_EVENT/pycbc-test"
          timeout: "300"
          interval: "5"
          working-directory: "e2e_project"

      - name: Run asimov monitor for the PyCBC production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov monitor

      - name: Verify the posterior file is genuinely readable
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            python3 -c "
            import h5py
            path = 'working/FAKE_PYCBC_TEST_EVENT/pycbc-test/pycbc-test.hdf'
            with h5py.File(path, 'r') as f:
                assert len(f.keys()) > 0, 'Posterior file has no top-level groups'
                print('Posterior file groups:', list(f.keys()))
            "

      # This is the regression check for the actual bug this plugin fixes:
      # the previous implementation never called super().__init__(), so
      # self.logger was never set and every method that logged (almost all
      # of them) raised AttributeError as soon as it ran for real -- masked
      # entirely by a unit test suite that never instantiated the pipeline
      # through asimov's own machinery. after_completion() now only marks
      # the production finished (no pesummary lookup of any kind -- see
      # below), so this just confirms that transition happened cleanly.
      - name: Confirm the PyCBC production reached a finished status
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            python3 -c "
            import yaml
            with open('.asimov/ledger.yml') as f:
                ledger = yaml.safe_load(f)
            event = next(e for e in ledger['events'] if e['name'] == 'FAKE_PYCBC_TEST_EVENT')
            production = next(p['pycbc-test'] for p in event['productions'] if 'pycbc-test' in p)
            status = production.get('status')
            print('pycbc-test status:', status)
            assert status == 'finished', f'Unexpected status: {status}'
            "

      # --- Dependency-driven post-processing (needs:) ------------------
      #
      # This plugin no longer submits PESummary itself (see
      # asimov_pycbc.pycbc.PyCBC.after_completion() and docs/index.rst) --
      # post-processing is instead a separate production with a `needs:`
      # dependency on pycbc-test, resolved entirely by asimov's own
      # dependency graph (Event.get_all_latest()). This installs the real
      # asimov-pesummary plugin and exercises that real hand-off end to end:
      # a genuine `summarypages` run against pycbc-test's real samples.

      # summarypages needs to `import pycbc` to read pycbc_inference's
      # native HDF5 format (confirmed directly: without pycbc importable in
      # the same environment, pesummary's PyCBC reader silently falls back
      # to a generic loader that can't parse the file and raises "Unable to
      # find a posterior samples table"). Installing into the same conda
      # env already used for pycbc_inference keeps pycbc importable here.
      - name: Install asimov-pesummary for the needs:-based post-processing hand-off
        run: |
          CONDA_BASE="$("${CONDA_EXE:-conda}" info --base)"
          CONDA_PYTHON="${CONDA_BASE}/envs/asimov/bin/python"
          "$CONDA_PYTHON" -m pip install asimov-pesummary
          # See setup-pycbc-env's own install step for why this matters: a
          # restrictive root umask can leave a freshly-installed package's
          # entry_points.txt unreadable by submituser, silently dropping it
          # from asimov's plugin discovery rather than erroring.
          chmod -R a+rX "$CONDA_BASE/envs/asimov"
          echo "Installed asimov-pesummary from: $("$CONDA_PYTHON" -c 'import asimov_pesummary; print(asimov_pesummary.__file__)')"
          echo "Installed pesummary from: $("$CONDA_PYTHON" -c 'import pesummary; print(pesummary.__file__)')"
          echo "Installed summarypages at: $("$CONDA_PYTHON" -c 'import shutil; print(shutil.which("summarypages"))')"

      - name: Diagnose asimov.pipelines entry-point discovery for pesummary as submituser
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            python3 -c "
            from importlib.metadata import entry_points
            eps = [ep for ep in entry_points(group='asimov.pipelines') if ep.value.startswith('asimov_pesummary')]
            print('Discovered asimov_pesummary entry points:', eps)
            for ep in eps:
                try:
                    ep.load()
                    print(f'  {ep.name}: loaded OK')
                except Exception as e:
                    print(f'  {ep.name}: FAILED TO LOAD: {e!r}')
            "

      - name: Add and build the real PESummary production (depends on pycbc-test)
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/test_blueprints/pesummary_production.yaml" -e FAKE_PYCBC_TEST_EVENT
            asimov manage build submit

      # The real completion criterion asimov-pesummary's own
      # detect_completion_processing() (inherited from the base Pipeline
      # class) checks for -- reaching it means summarypages genuinely read
      # pycbc-test's real HDF5 output (via _previous_assets()), generated
      # real plots, and wrote a real, parseable combined posterior file.
      - name: Wait for real summarypages output
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "posterior_samples.h5"
          directory: "pages/FAKE_PYCBC_TEST_EVENT/pycbc-test-pesummary/pesummary/samples"
          timeout: "300"
          interval: "10"
          working-directory: "e2e_project"

      - name: Verify the summarypages output is genuinely readable
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            python3 -c "
            import h5py
            path = 'pages/FAKE_PYCBC_TEST_EVENT/pycbc-test-pesummary/pesummary/samples/posterior_samples.h5'
            with h5py.File(path, 'r') as f:
                groups = list(f.keys())
                print('Combined posterior file groups:', groups)
                assert 'pycbc-test-pesummary' in groups, f'Expected label missing from {groups}'
            "

      # A single `asimov monitor` call right after the output file appears
      # isn't reliable: the underlying HTCondor job may not yet be reported
      # as exited (the file can be fully written moments before the job's
      # own exit is visible to a status query), so the production can still
      # read "running" on that first poll -- confirmed directly: a real e2e
      # run hit exactly this, with a genuinely correct summarypages output
      # already on disk. Poll for a few cycles instead, matching the retry
      # pattern asimov-pesummary's own e2e test uses for an analogous
      # refresh-and-settle wait, rather than asserting on a single call.
      - name: Wait for the PESummary production to reach a finished/uploaded status
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            timeout=120
            elapsed=0
            asimov monitor
            until python3 -c "
            import sys
            import yaml
            with open('.asimov/ledger.yml') as f:
                ledger = yaml.safe_load(f)
            event = next(e for e in ledger['events'] if e['name'] == 'FAKE_PYCBC_TEST_EVENT')
            production = next(p['pycbc-test-pesummary'] for p in event['productions'] if 'pycbc-test-pesummary' in p)
            status = production.get('status')
            print('pycbc-test-pesummary status:', status)
            sys.exit(0 if status in ('finished', 'uploaded') else 1)
            "; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "::error::Timed out waiting for pycbc-test-pesummary to reach finished/uploaded"
                exit 1
              fi
              sleep 10
              elapsed=$((elapsed + 10))
              asimov monitor || true
            done

      - name: Archive artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            e2e_project/.asimov/
            e2e_project/working/
            e2e_project/checkouts/
            e2e_project/pages/
          retention-days: 5
