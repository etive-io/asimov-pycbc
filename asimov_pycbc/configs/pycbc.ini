;
; PyCBC Inference configuration file created by asimov
; for {{ production.event.name }}.
;
{%- assign sampler = production.meta['sampler'] -%}
{%- assign likelihood = production.meta['likelihood'] -%}
{%- assign data = production.meta['data'] -%}
{%- assign waveform = production.meta['waveform'] -%}
{%- assign ifos = production.meta['interferometers'] -%}
{%- assign flow_val = 20 -%}
{%- if likelihood and likelihood['minimum frequency'] -%}
{%- assign flow_val = likelihood['minimum frequency'][ifos[0]] -%}
{%- for ifo in ifos -%}
{%- assign this_flow = likelihood['minimum frequency'][ifo] -%}
{%- if this_flow < flow_val -%}{%- assign flow_val = this_flow -%}{%- endif -%}
{%- endfor -%}
{%- endif %}

[data]
instruments = {% for ifo in ifos %}{{ ifo }} {% endfor %}

trigger-time = {{ production.meta['event time'] }}
analysis-start-time = {{ likelihood['segment start'] | default: -6 }}
analysis-end-time = {{ likelihood['post trigger time'] | default: 2 }}
sample-rate = {{ likelihood['sample rate'] | default: 2048 }}
pad-data = 8
strain-high-pass = {{ flow_val | minus: 5 }}

{%- if data and data['fake strain'] %}
; Simulated (Gaussian) noise -- no real strain data needed.
fake-strain = {% for ifo in ifos %}{{ ifo }}:{{ data['fake strain'] }} {% endfor %}
fake-strain-seed = {{ data['fake strain seed'] | default: 0 }}
psd-model = {% for ifo in ifos %}{{ ifo }}:{{ data['fake strain'] }} {% endfor %}
channel-name = {% for ifo in ifos %}{{ ifo }}:FAKE-STRAIN {% endfor %}
{%- elsif data and data['cache files'] %}
frame-cache = {% for ifo in ifos %}{{ ifo }}:{{ data['cache files'][ifo] }} {% endfor %}
channel-name = {% for ifo in ifos %}{{ ifo }}:{{ data['channels'][ifo] }} {% endfor %}
psd-estimation = median-mean
psd-segment-length = 8
psd-segment-stride = 4
{%- elsif data and data['frame files'] %}
frame-files = {% for ifo in ifos %}{{ ifo }}:{{ data['frame files'][ifo] }} {% endfor %}
channel-name = {% for ifo in ifos %}{{ ifo }}:{{ data['channels'][ifo] }} {% endfor %}
psd-estimation = median-mean
psd-segment-length = 8
psd-segment-stride = 4
{%- else %}
frame-type = {% for ifo in ifos %}{{ ifo }}:{{ data['frame types'][ifo] }} {% endfor %}
channel-name = {% for ifo in ifos %}{{ ifo }}:{{ data['channels'][ifo] }} {% endfor %}
psd-estimation = median-mean
psd-segment-length = 8
psd-segment-stride = 4
{%- endif %}

[model]
name = gaussian_noise
low-frequency-cutoff = {{ flow_val }}

[sampler]
name = {{ sampler['sampler'] | default: "dynesty" }}
dlogz = {{ sampler['sampler kwargs']['dlogz'] | default: 0.1 }}
nlive = {{ sampler['sampler kwargs']['nlive'] | default: 2000 }}
checkpoint_time_interval = 1800

;
;   Sampling transforms
;
[sampling_params]
mass1, mass2 : mchirp, q

[sampling_transforms-mchirp+q]
name = mass1_mass2_to_mchirp_q

[variable_params]
delta_tc =
mchirp =
q =
spin1_a =
spin1_azimuthal =
spin1_polar =
spin2_a =
spin2_azimuthal =
spin2_polar =
distance =
coa_phase =
inclination =
polarization =
ra =
dec =

[static_params]
approximant = {{ waveform['approximant'] | default: "IMRPhenomPv2" }}
f_lower = {{ flow_val }}
f_ref = {{ waveform['reference frequency'] | default: flow_val }}
trigger_time = {{ production.meta['event time'] }}

[waveform_transforms-tc]
name = custom
inputs = delta_tc
tc = {{ production.meta['event time'] }} + delta_tc

[prior-delta_tc]
name = uniform
min-delta_tc = -0.1
max-delta_tc = 0.1

[prior-mchirp]
name = uniform
min-mchirp = 10.
max-mchirp = 80.

[prior-q]
name = uniform
min-q = 1.
max-q = 8.

[prior-spin1_a]
name = uniform
min-spin1_a = 0.0
max-spin1_a = 0.99

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = 0.0
max-spin2_a = 0.99

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

[waveform_transforms-spin1x+spin1y+spin1z]
name = spherical_to_cartesian
x = spin1x
y = spin1y
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x+spin2y+spin2z]
name = spherical_to_cartesian
x = spin2x
y = spin2y
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal

[prior-distance]
name = uniform_radius
min-distance = 10
max-distance = 2000

[prior-coa_phase]
name = uniform_angle

[prior-inclination]
name = sin_angle

[prior-ra+dec]
name = uniform_sky

[prior-polarization]
name = uniform_angle
