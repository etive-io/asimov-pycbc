[executables]
; paths to executables to use in workflow
inference = ${which:run_pycbc_inference}
extract_posterior = ${which:pycbc_inference_extract_samples}
plot_posterior = ${which:pycbc_inference_plot_posterior}
plot_posterior_summary = ${which:pycbc_inference_plot_posterior}
plot_prior = ${which:pycbc_inference_plot_prior}
table_summary = ${which:pycbc_inference_table_summary}
create_fits_file = ${which:pycbc_inference_create_fits}
plot_skymap = ${which:pycbc_inference_plot_skymap}
plot_spectrum = ${which:pycbc_plot_psd_file}
results_page = ${which:pycbc_make_html_page}
; diagnostic plots
plot_acceptance_rate = ${which:pycbc_inference_plot_acceptance_rate}
plot_samples = ${which:pycbc_inference_plot_samples}
page_versioning = ${which:pycbc_page_versioning}

[variable_params]
delta_tc = 
srcmchirp = 
q = 
spin1_a = 
spin1_azimuthal = 
spin1_polar = 
spin2_a = 
spin2_azimuthal = 
spin2_polar = 
comoving_volume = 
inclination = 
ra = 
dec = 
coa_phase = 

[static_params]
approximant = {{ production.meta['waveform']['approximant'] }}
f_lower = {{ quality['lowest minimum frequency'] }}
f_ref = {{ production.meta['waveform']['reference frequency'] }}
trigger_time = {{ production.meta['event time'] }}

[prior-srcmchirp]
name = mchirp_from_uniform_mass1_mass2
min-srcmchirp = 20
max-srcmchirp = 60

[prior-q]
name = q_from_uniform_mass1_mass2
min-q = 1
max-q = 6

[prior-spin1_a]
name = uniform
min-spin1_a = 0.0
max-spin1_a = 0.99

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = 0.0
max-spin2_a = 0.99

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

[waveform_transforms-spin1x+spin1y+spin1z]
name = spherical_to_cartesian
x = spin1x
y = spin1y
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x+spin2y+spin2z]
name = spherical_to_cartesian
x = spin2x
y = spin2y
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal

[prior-delta_tc]
name = uniform
min-delta_tc = -0.1
max-delta_tc = 0.1

[waveform_transforms-tc]
name = custom
inputs = trigger_time, delta_tc
tc = trigger_time + delta_tc

[prior-inclination]
name = sin_angle

[prior-coa_phase]
name = uniform_angle

[prior-ra+dec]
name = uniform_sky

[prior-comoving_volume]
name = uniform
min-comoving_volume = 5e3
max-comoving_volume = 1e11

[waveform_transforms-redshift]
name = custom
inputs = comoving_volume
redshift = redshift_from_comoving_volume(comoving_volume)

[waveform_transforms-distance]
name = custom
inputs = comoving_volume
distance = distance_from_comoving_volume(comoving_volume)

[waveform_transforms-mass1]
name = custom
inputs = srcmchirp, q, redshift
mass1 = mass1_from_mchirp_q(srcmchirp,q) * (1 + redshift)

[waveform_transforms-mass2]
name = custom
inputs = srcmchirp, q, redshift
mass2 = mass2_from_mchirp_q(srcmchirp,q) * (1 + redshift)

[model]
name = marginalized_polarization
low-frequency-cutoff = 20
ignore-failed-waveforms = 

[sampler]
name = {{sampler['sampler'] | default: "dynesty" }}
dlogz = 0.1
nlive = {{ sampler['sampler kwargs']['nlive'] | default: 2000 }}
nact = 50
walks = 200
maxmcmc = 10000
sample = rwalk
checkpoint_time_interval = 1800

[data]
instruments = {{ production.meta['interferometers'] }}
trigger-time = {{ production.meta['event time'] }}
; analysis-start-time = -6
analysis-end-time = {{ likelihood['post trigger time'] | default: 2.0 }}
; PSD files
psd-file =  {% for ifo in ifos %}{{ifo}}:{{production.psds[ifo]}} {% endfor %}
{%- if "data files" in data %}
frame-files = {% for ifo in ifos %}{{ifo}}:{{data['data files'][ifo]}} {% endfor %}
{%- elif "cache files" in data %}
frame-cache = {% for ifo in ifos %}{{ifo}}:{{data['cache files'][ifo]}}{% endfor %} 
{%- else %}
frame-type =  {% for ifo in ifos %}{{ifo}}:{{data['frame types'][ifo]}} {% endfor %}
channel-name = H1:GWOSC-16KHZ_R1_STRAIN L1:GWOSC-16KHZ_R1_STRAIN
{%- endif %}
sample-rate = {{ likelihood['sample rate'] | round }}
strain-high-pass = 15
pad-data = 8

[calibration]
h1_model = cubic_spline
h1_minimum_frequency = 20
h1_maximum_frequency = 1000
h1_n_points = 10
l1_model = cubic_spline
l1_minimum_frequency = 20
l1_maximum_frequency = 1000
l1_n_points = 10
v1_model = cubic_spline
v1_minimum_frequency = 20
v1_maximum_frequency = 1000
v1_n_points = 10