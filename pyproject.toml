[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[toml]>=3.4.3",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[project]
name = "asimov-pycbc"
dynamic = ["version"]
authors = [
    { name = "Daniel Williams", email = "daniel.williams@glasgow.ac.uk" },
]
description = "PyCBC Inference pipeline integration for Asimov"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: English",
]
requires-python = ">=3.10"
dependencies = [
    "asimov>=0.7",
]

[project.optional-dependencies]
asimov = [
    "asimov>=0.7",
]
docs = [
    "sphinx",
    "kentigern >= 0.3.0",
    "numpydoc",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[project.entry-points."asimov.pipelines"]
pycbc = "asimov_pycbc:PyCBC"

[project.urls]
"Source code" = "https://github.com/etive-io/asimov-pycbc"
"Documentation" = "https://etive-io.github.io/asimov-pycbc/"

[tool.setuptools]
packages = ["asimov_pycbc"]

[tool.setuptools.package-data]
asimov_pycbc = ["configs/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=asimov_pycbc --cov-report=html --cov-report=term"
